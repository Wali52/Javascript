<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">
    <h2>Scientific Calculator</h2>

    <input type="text" id="display" readonly placeholder="0">

    <div class="buttons">
        <button class="control" onclick="clearDisplay()">C</button>
        <button class="control" onclick="backspace()">⌫</button>
        <button class="control" onclick="appendValue('(')">(</button>
        <button class="control" onclick="appendValue(')')">)</button>
        <button class="operator" onclick="appendValue('/')">÷</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('*')">×</button>
        <button class="func" onclick="appendValue('Math.sqrt(')">√</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('-')">−</button>
        <button class="func" onclick="appendValue('**2')">x²</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('+')">+</button>
        <button class="func" onclick="appendValue('Math.log(')">ln</button>

        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button onclick="toggleSign()">±</button>
        <button class="equals" onclick="calculate()">=</button>
        <button class="func" onclick="appendValue('Math.sin(')">sin</button>

        <button class="func" onclick="appendValue('Math.cos(')">cos</button>
        <button class="func" onclick="appendValue('Math.tan(')">tan</button>
        <button class="func" onclick="appendValue('Math.exp(')">exp</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
